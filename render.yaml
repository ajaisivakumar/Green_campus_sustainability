services:
  # ── Backend (FastAPI + Neon DB) ────────────────────────────────────────────
  - type: web
    name: green-campus-backend
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false                       # Paste your Neon connection string in Render dashboard
      - key: GEMINI_API_KEY
        sync: false                       # Paste your Gemini API key in Render dashboard
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: GEMINI_ENABLED
        value: "true"
      - key: FRONTEND_ORIGIN
        fromService:                      # Auto-fills from the frontend service URL below
          name: green-campus-frontend
          type: web
          property: host
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: LOG_LEVEL
        value: INFO

  # ── Frontend (React / Vite static site) ────────────────────────────────────
  - type: web
    name: green-campus-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_URL
        fromService:                      # Auto-fills backend URL — no hardcoding needed
          name: green-campus-backend
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html          # Required for React Router (SPA routing)
